}

function wireWarBoard(container, allProjTasks) {
  const main = document.getElementById('main');

  // Mode toggle
  document.getElementById('wb-mode-kanban')?.addEventListener('click', () => {
    S.warboardMode = 'kanban'; renderProjectOverview(main);
  });
  document.getElementById('wb-mode-matrix')?.addEventListener('click', () => {
    S.warboardMode = 'matrix'; renderProjectOverview(main);
  });

  let draggingId = null;

  // Cards — click + drag
  container.querySelectorAll('.kanban-card').forEach(card => {
    card.addEventListener('click', () => {
      S.selectedTaskId = card.dataset.tid;
      renderApp();
    });
    card.addEventListener('dragstart', e => {
      draggingId = card.dataset.tid;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      draggingId = null;
    });
  });

  // Kanban columns
  container.querySelectorAll('.kanban-col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over'); });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      if (!draggingId) return;
      const task = S.tasks.find(t => t.id === draggingId);
      if (!task) return;
      const newStatus = col.dataset.status;
      if (task.status === newStatus) return;
      task.status = newStatus;
      if (newStatus === 'done' && !task.completedAt) task.completedAt = new Date().toISOString();
      if (newStatus !== 'done') task.completedAt = null;
      renderProjectOverview(main);
      saveData();
    });
  });

  // Matrix quadrants
  const QUAD_DROPS = {
    q1: { important: true,  urgent: true  },
    q2: { important: true,  urgent: false },
    q3: { important: false, urgent: true  },
    q4: { important: false, urgent: false },
  };
  container.querySelectorAll('.matrix-quadrant').forEach(quad => {
    quad.addEventListener('dragover', e => { e.preventDefault(); quad.classList.add('drag-over'); });
    quad.addEventListener('dragleave', e => { if (!quad.contains(e.relatedTarget)) quad.classList.remove('drag-over'); });
    quad.addEventListener('drop', e => {
      e.preventDefault();
      quad.classList.remove('drag-over');
      if (!draggingId) return;
      const task = S.tasks.find(t => t.id === draggingId);
      if (!task) return;
      const drop = QUAD_DROPS[quad.dataset.quad];
      task.important = drop.important;
      if (drop.urgent) {
        task.priority = 3;
      } else if (task.priority === 3) {
        task.priority = 2;
      }
      renderProjectOverview(main);
      saveData();
    });
  });
}

function weeklyFocusSecs(proj, allProjTasks) {
  const taskIds = new Set(allProjTasks.map(t => t.id));
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  monday.setHours(0, 0, 0, 0);
  return S.sessions
    .filter(s => s.type === 'focus' && s.completed && taskIds.has(s.taskId) && new Date(s.startedAt) >= monday)
    .reduce((a, s) => a + (s.durationSeconds ?? 0), 0);
}

function buildProjectStatsHTML(proj, allProjTasks) {
  const dayStr = d => d.toISOString().slice(0, 10);

  // Sessions for this project's tasks
  const taskIds = new Set(allProjTasks.map(t => t.id));
  const projSessions = S.sessions.filter(s => s.type === 'focus' && s.completed && taskIds.has(s.taskId));

  // Total time: sessions + manual minutes
  const sessSecs  = projSessions.reduce((a, s) => a + (s.durationSeconds ?? 0), 0);
  const manualSecs = allProjTasks.reduce((a, t) => a + (t.manualMinutes ?? 0) * 60, 0);
  const totalSecs  = sessSecs + manualSecs;
  const totalH = Math.floor(totalSecs / 3600), totalM = Math.floor((totalSecs % 3600) / 60);
  const timeStr = totalH > 0 ? `${totalH}h ${totalM}m` : `${totalM}m`;

  // Status counts
  const sc = { todo: 0, in_progress: 0, done: 0, archived: 0 };
  for (const t of allProjTasks) sc[t.status] = (sc[t.status] ?? 0) + 1;
  const totalAll = Math.max(1, Object.values(sc).reduce((a,b) => a+b, 0));

  // Avg focus quality
  const qualSess = projSessions.filter(s => s.focusQualityScore);
  const avgQ = qualSess.length
    ? (qualSess.reduce((a,s) => a + s.focusQualityScore, 0) / qualSess.length).toFixed(1)
    : '—';

  // Completion rate
  const compRate = allProjTasks.length > 0 ? Math.round(sc.done / allProjTasks.length * 100) : 0;

  // Time per task (top 8 by time)
  const taskTimes = allProjTasks.map(t => {
    const tSess = projSessions.filter(s => s.taskId === t.id).reduce((a,s) => a + (s.durationSeconds ?? 0), 0);
    const tTotal = tSess + (t.manualMinutes ?? 0) * 60;
    return { t, secs: tTotal };
  }).filter(x => x.secs > 0).sort((a,b) => b.secs - a.secs).slice(0, 8);
  const maxTaskSecs = Math.max(1, taskTimes[0]?.secs ?? 1);

  const taskBarsHTML = taskTimes.length > 0 ? taskTimes.map(({ t, secs }) => {
    const pct = Math.round(secs / maxTaskSecs * 100);
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    const val = h > 0 ? `${h}h ${m}m` : `${m}m`;
    const statusDot = { done: 'var(--green)', in_progress: 'var(--accent)', todo: 'var(--text3)', archived: 'var(--text3)' }[t.status] ?? 'var(--text3)';
    return `
      <div class="proj-bar-row" style="cursor:pointer" data-tid="${t.id}">
        <span class="proj-bar-name" title="${escHtml(t.title)}" style="display:flex;align-items:center;gap:6px">
          <span style="width:7px;height:7px;border-radius:50%;background:${statusDot};flex-shrink:0"></span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(t.title)}</span>
        </span>
        <div class="proj-bar-track">
          <div class="proj-bar-fill" style="width:${pct}%;background:${proj.color}"></div>
        </div>
        <span class="proj-bar-val">${val}</span>
      </div>`;
  }).join('') : '<p class="empty-hint">No time recorded yet.</p>';

  // Activity heatmap — last 12 weeks, scoped to this project
  const WEEKS = 12, DAYS = WEEKS * 7;
  const heatStart = new Date(); heatStart.setDate(heatStart.getDate() - DAYS + 1); heatStart.setHours(0,0,0,0);
  const dayMap = {};
  for (const s of projSessions) {
    const k = dayStr(new Date(s.startedAt));
    dayMap[k] = (dayMap[k] ?? 0) + (s.durationSeconds ?? 0);
  }
  for (const t of allProjTasks.filter(t => t.status === 'done' && t.manualMinutes)) {
    const k = dayStr(new Date(t.modifiedAt));
    dayMap[k] = (dayMap[k] ?? 0) + t.manualMinutes * 60;
  }
  const cells = [];
  let prevMonth = -1;
  for (let i = 0; i < DAYS; i++) {
    const cd = new Date(heatStart); cd.setDate(cd.getDate() + i);
    const k  = dayStr(cd);
    const s  = dayMap[k] ?? 0;
    const h  = s / 3600;
    const level = h === 0 ? '' : h < 1 ? 'l1' : h < 2 ? 'l2' : h < 4 ? 'l3' : 'l4';
    cells.push(`<div class="hm-cell ${level}" title="${k}: ${fmtMinutes(Math.round(s/60))}"></div>`);
    prevMonth = cd.getMonth();
  }

  // Recent sessions (last 6)
  const recentSess = [...projSessions].sort((a,b) => b.startedAt.localeCompare(a.startedAt)).slice(0, 6);
  const recentHTML = recentSess.length > 0 ? recentSess.map(sess => {
    const task = allProjTasks.find(t => t.id === sess.taskId);
    const dur  = Math.round((sess.durationSeconds ?? 0) / 60);
    const stars = sess.focusQualityScore
      ? '★'.repeat(sess.focusQualityScore) + '☆'.repeat(5 - sess.focusQualityScore)
      : '';
    const date = sess.startedAt.slice(0, 10);
    return `
      <div class="session-log-item" style="flex-direction:column;align-items:flex-start;gap:2px;padding:8px 0">
        <div style="display:flex;justify-content:space-between;width:100%">
          <span style="font-size:12px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${escHtml(task?.title ?? '—')}</span>
          <span style="font-size:12px;color:var(--text2);flex-shrink:0;margin-left:8px">${dur} min</span>
        </div>
        <div style="display:flex;justify-content:space-between;width:100%">
          <span style="font-size:11px;color:var(--text3)">${date}</span>
          ${stars ? `<span style="color:var(--yellow);font-size:10px">${stars}</span>` : ''}
        </div>
      </div>`;
  }).join('') : '<p class="empty-hint">No sessions yet.</p>';

  return `
    ${(() => {
      if (!proj.pomodoroWeeklyBudget) return '';
      const usedSecs   = weeklyFocusSecs(proj, allProjTasks);
      const budgetSecs = proj.pomodoroWeeklyBudget * 3600;
      const pct  = Math.min(100, Math.round(usedSecs / budgetSecs * 100));
      const over = usedSecs > budgetSecs;
      const usedH = Math.floor(usedSecs / 3600), usedM = Math.floor((usedSecs % 3600) / 60);
      const usedStr = usedH > 0 ? `${usedH}h ${usedM}m` : `${usedM}m`;
      return `
        <div style="margin-bottom:24px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
            <span style="font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--text3);text-transform:uppercase">Weekly budget</span>
            <span style="font-size:13px;color:${over ? 'var(--red)' : 'var(--text2)'}">
              <strong style="color:${over ? 'var(--red)' : 'var(--text)'}">${usedStr}</strong> / ${proj.pomodoroWeeklyBudget}h
              ${over ? '<span style="color:var(--red);font-size:11px;margin-left:4px">over budget</span>' : `<span style="color:var(--text3);font-size:11px;margin-left:4px">${pct}%</span>`}
            </span>
          </div>
          <div style="height:8px;background:var(--surface3);border-radius:4px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:${over ? 'var(--red)' : 'var(--green)'};border-radius:4px;transition:width .4s ease"></div>
          </div>
        </div>`;
    })()}
    <!-- Stat cards -->
    <div class="stats-cards" style="margin-bottom:24px">
      <div class="stat-card">
        <span class="stat-card-icon">⏱</span>
        <div class="stat-card-val">${totalSecs > 0 ? timeStr : '—'}</div>
        <div class="stat-card-lbl">Focus time</div>
      </div>
      <div class="stat-card">
        <span class="stat-card-icon">✓</span>
        <div class="stat-card-val">${sc.done}</div>
        <div class="stat-card-lbl">Tasks done</div>
      </div>

            <input type="checkbox" id="task-important" ${task.important ? 'checked' : ''} style="width:15px;height:15px;cursor:pointer">
            <span>Important <span style="color:var(--text2);font-size:12px">(Eisenhower matrix)</span></span>
          </label>

      <!-- Pomodoro dots -->
      <div class="pomo-track">
        <label>Pomodoro progress</label>
        <div class="pomo-dots" id="pomo-dots">${buildPomoDots(task)}</div>
        <p class="text2" id="pomo-count" style="font-size:12px;margin-top:4px">
          ${task.completedPomodoros ?? 0} completed
        </p>
      </div>

      <!-- Notes -->

        <label>Notes</label>
        <textarea id="task-notes" placeholder="Notes, context, references…">${escHtml(task.notes ?? '')}</textarea>

        </div>

            <div class="subtask-item">

              <span class="subtask-title${st.status==='done'?' done':''}">${escHtml(st.title)}</span>

  });

  main.querySelectorAll('.st-del').forEach(btn => {
    btn.onclick = async e => {
      task.subtasks = task.subtasks.filter(s => s.id !== e.target.dataset.stid);
      await saveTask(task);
      renderTaskDetail(main, task);
    };
  });

  attachTimerEvents(task);
}

/* ═══════════════════════════════════════════════════════════
   UI — TIMER
═══════════════════════════════════════════════════════════ */
function buildTimerHTML(task) {
  const isIdle   = S.pomState === 'idle';
  const isPaused = S.pomState === 'paused';
  const isBreak  = S.pomState === 'short_break' || S.pomState === 'long_break';
  const isFocus  = S.pomState === 'focus';

  const phaseLabels = {
    idle:        'Ready',
    focus:       'Focus',
    short_break: 'Short break',
    long_break:  'Long break',
    paused:      'Paused',
  };

  const timerClass = isBreak ? 'break' : isIdle ? 'idle' : '';

  const taskSessions = S.sessions.filter(s => s.taskId === task.id && s.completed).slice(-5).reverse();

  return `
    <div class="timer-phase-label">${phaseLabels[S.pomState] ?? S.pomState}</div>
    <div class="timer-display ${timerClass}">${fmtTime(S.pomSeconds)}</div>

    <div class="timer-controls">
      ${isIdle ? `
        <button class="btn btn-primary" id="btn-pom-start">▶ Start</button>
      ` : isPaused ? `
        <button class="btn btn-primary" id="btn-pom-start">▶ Resume</button>
        <button class="btn btn-secondary" id="btn-pom-skip">⏭ Skip</button>
      ` : `
        <button class="btn btn-secondary" id="btn-pom-pause">⏸ Pause</button>
        <button class="btn btn-secondary" id="btn-pom-skip">⏭ Skip</button>
      `}
    </div>

    <p class="timer-session-info">
      ${isIdle
        ? `${task.completedPomodoros ?? 0} session${(task.completedPomodoros ?? 0) !== 1 ? 's' : ''} completed`
        : `Session ${S.pomCount + (isFocus ? 1 : 0)} · ${effectivePomCfg().streakLength - (S.pomCount % effectivePomCfg().streakLength)} until long break`}
    </p>

    <div class="timer-sep"></div>

    ${isIdle ? `
      <button class="btn btn-ghost btn-full" id="btn-cfg-toggle" style="font-size:12px;color:var(--text3);justify-content:space-between">
        <span>Adjust session</span><span id="cfg-arrow">▼</span>
      </button>
      <div id="timer-cfg-panel" style="display:none;margin-top:10px">
        <div class="timer-cfg">
          <div class="timer-cfg-row">
            <label>Focus (min)</label>
            <input type="number" id="cfg-focus" value="${effectivePomCfg().focus}" min="1" max="90">
          </div>
          <div class="timer-cfg-row">
            <label>Short break</label>
            <input type="number" id="cfg-short" value="${effectivePomCfg().shortBreak}" min="1" max="30">
          </div>
          <div class="timer-cfg-row">
            <label>Long break</label>
            <input type="number" id="cfg-long" value="${effectivePomCfg().longBreak}" min="1" max="60">
          </div>
          <div class="timer-cfg-row">
            <label>Streak</label>
            <input type="number" id="cfg-streak" value="${effectivePomCfg().streakLength}" min="2" max="10">
          </div>
        </div>
        <button class="btn btn-primary btn-full" id="btn-cfg-save" style="margin-top:10px;font-size:12px">Save for this task</button>
      </div>
    ` : ''}

    ${taskSessions.length > 0 ? `
      <div class="timer-sessions-log">
        <label>Recent sessions</label>
        ${taskSessions.map(sess => {
          const stars = sess.focusQualityScore
            ? '<span class="session-quality">' + '★'.repeat(sess.focusQualityScore) + '☆'.repeat(5 - sess.focusQualityScore) + '</span>'
            : '';
          const dur = Math.round(sess.durationSeconds / 60);
          return `<div class="session-log-item"><span>${dur} min</span>${stars}</div>`;
        }).join('')}
      </div>
    ` : ''}
  `;
}

function renderTimer() {
  const panel = document.getElementById('timer-panel');
  if (!panel) return;
  const task = S.tasks.find(t => t.id === S.selectedTaskId);
  if (!task) return;
  const isCollapsed = panel.classList.contains('collapsed');
  const body = panel.querySelector('.timer-panel-body');
  if (body) {
    body.innerHTML = buildTimerHTML(task);
  } else {
    panel.innerHTML = buildTimerHTML(task);
  }
  // Update toggle label
  const lbl = panel.querySelector('.timer-panel-toggle span:first-child');
  if (lbl) lbl.textContent = `🍅 Pomodoro${S.pomState !== 'idle' ? ' · active' : ''}`;
  attachTimerEvents(task);
}

function attachTimerEvents(task) {
  document.getElementById('timer-panel-toggle')?.addEventListener('click', () => {
    document.getElementById('timer-panel')?.classList.toggle('collapsed');
  });

  document.getElementById('btn-pom-start')?.addEventListener('click', () => {
    // If running for a different task, ask
    if (S.pomState !== 'idle' && S.pomState !== 'paused' && S.pomCurrentSession?.taskId !== task.id) {
      if (!confirm('There is an active timer for another task. Stop it and start here?')) return;
      stopPomodoro();
    }
    S.selectedTaskId = task.id;
    startPomodoro(task.id);
  });

  document.getElementById('btn-pom-pause')?.addEventListener('click', pausePomodoro);
  document.getElementById('btn-pom-skip')?.addEventListener('click', () => skipPomodoro(task.id));

  document.getElementById('btn-cfg-toggle')?.addEventListener('click', () => {
    const panel = document.getElementById('timer-cfg-panel');
    const arrow = document.getElementById('cfg-arrow');
    if (!panel) return;
    const open = panel.style.display === 'none';
    panel.style.display = open ? 'block' : 'none';
    if (arrow) arrow.textContent = open ? '▲' : '▼';
  });

  document.getElementById('btn-cfg-save')?.addEventListener('click', async () => {
    if (!task) return;
    task.pomCfg = {
      focus:        Math.max(1, parseInt(document.getElementById('cfg-focus')?.value)  || 25),
      shortBreak:   Math.max(1, parseInt(document.getElementById('cfg-short')?.value)  || 5),
      longBreak:    Math.max(1, parseInt(document.getElementById('cfg-long')?.value)   || 15),
      streakLength: Math.max(2, parseInt(document.getElementById('cfg-streak')?.value) || 4),
    };
    if (S.pomState === 'idle') S.pomSeconds = task.pomCfg.focus * 60;
    await saveTask(task);
    toast('Saved for this task', 'success');
    renderTimer();
  });
}

async function saveTaskFromForm(task) {
  const title = document.getElementById('task-title-edit')?.value?.trim();
  if (!title) { toast('Title cannot be empty', 'error'); return; }

  task.title              = title;
  task.notes              = document.getElementById('task-notes')?.value ?? '';
  task.priority           = parseInt(document.getElementById('task-priority')?.value ?? '0');
  task.important          = document.getElementById('task-important')?.checked ?? false;
  task.startDate          = document.getElementById('task-start')?.value || null;
  task.dueDate            = document.getElementById('task-due')?.value || null;
  const manualVal = parseInt(document.getElementById('task-manual-mins')?.value ?? '');
  task.manualMinutes      = manualVal > 0 ? manualVal : null;

  await saveTask(task);
  renderSidebar();
  toast('Task saved', 'success');
}

async function handleDeleteTask(id) {
  if (!confirm('Delete this task? This cannot be undone.')) return;
  await deleteTask(id);
  S.selectedTaskId = null;
  if (S.pomCurrentSession?.taskId === id) stopPomodoro();
  renderApp();
  toast('Task deleted', 'info');
}

async function handleDeleteProject(id) {
  if (!confirm('Delete this project and all its tasks? This cannot be undone.')) return;
  await deleteProject(id);
  S.selectedProjectId = null;
  S.selectedTaskId = null;
  stopPomodoro();
  renderApp();
  toast('Project deleted', 'info');
}

═══════════════════════════════════════════════════════════ */
function showModal(html) {
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-box').innerHTML = html;
  overlay.classList.remove('hidden');

  const close = e => {
    if (e.target === overlay) closeModal();
    overlay.removeEventListener('click', close);
  };
  overlay.addEventListener('click', close);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

    <div class="input-group">
      <label>Description</label>
      <input id="m-st-title" type="text" placeholder="Subtask description" autofocus maxlength="200">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="m-cancel">Cancel</button>
      <button class="btn btn-primary" id="m-create-st">Add</button>
    </div>
  `);

  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-create-st').onclick = async () => {
    const title = document.getElementById('m-st-title').value.trim();
    if (!title) return;
    if (!task.subtasks) task.subtasks = [];
    task.subtasks.push({ id: uid(), title, status: 'todo', modifiedAt: iso() });
    await saveTask(task);
    closeModal();
    const main = document.getElementById('main');
    renderTaskDetail(main, task);
    toast('Subtask added', 'success');
  };
  document.getElementById('m-st-title').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('m-create-st').click();
  };
}

function showQualityScoreModal(sessionId) {
  showModal(`
    <h3>How was your focus?</h3>
    <p class="text2" style="font-size:13px">Rate the quality of your focus session.</p>
    <div class="quality-grid">
      ${[1,2,3,4,5].map(n => `
        <button class="quality-btn" data-score="${n}">${n}</button>
      `).join('')}
    </div>
    <p class="quality-label">1 = very hard to focus &nbsp;·&nbsp; 5 = total flow</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="m-skip-quality">Skip</button>
    </div>
  `);

  document.getElementById('m-skip-quality').onclick = closeModal;
  document.querySelectorAll('.quality-btn').forEach(btn => {
    btn.onclick = async () => {
      const score = parseInt(btn.dataset.score);
      // Update the stored session
      const raw = JSON.parse(localStorage.getItem(SK.SESSIONS) ?? '[]');
      const recIdx = raw.findIndex(r => r.id === sessionId);
      if (recIdx >= 0) {
        // We need to decrypt, update, re-encrypt
        try {
          const sess = await decryptData(raw[recIdx].enc);
          sess.focusQualityScore = score;
          raw[recIdx].enc = await encryptData(sess);
          localStorage.setItem(SK.SESSIONS, JSON.stringify(raw));
          const si = S.sessions.findIndex(s => s.id === sessionId);
          if (si >= 0) S.sessions[si].focusQualityScore = score;
        } catch { /* ignore */ }
      }
      closeModal();
      renderTimer(); // refresh sessions log
    };
  });
}

function showSettingsModal() {
  const rawTasks    = JSON.parse(localStorage.getItem(SK.TASKS)    ?? '[]');
  const rawProjects = JSON.parse(localStorage.getItem(SK.PROJECTS) ?? '[]');
  const rawSessions = JSON.parse(localStorage.getItem(SK.SESSIONS) ?? '[]');

  const totalFocus = S.sessions
    .filter(s => s.type === 'focus' && s.completed)
    .reduce((a, s) => a + (s.durationSeconds ?? 0), 0);
  const focusHrs = Math.round(totalFocus / 36) / 100;

  showModal(`
    <h3>Settings &amp; Data</h3>

    <div style="background:var(--surface2);border-radius:var(--radius);padding:14px;font-size:13px;line-height:1.8">
      <div style="display:flex;justify-content:space-between"><span class="text2">Projects</span><strong>${rawProjects.length}</strong></div>
      <div style="display:flex;justify-content:space-between"><span class="text2">Tasks</span><strong>${rawTasks.length}</strong></div>
      <div style="display:flex;justify-content:space-between"><span class="text2">Pomodoro sessions</span><strong>${rawSessions.length}</strong></div>
      <div style="display:flex;justify-content:space-between"><span class="text2">Focus hours</span><strong>${focusHrs}h</strong></div>
    </div>

    <div style="border-top:1px solid var(--border);padding-top:16px">
      <p style="font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--text3);text-transform:uppercase;margin-bottom:12px">Default Pomodoro</p>
      <div class="timer-cfg">
        <div class="timer-cfg-row">
          <label>Focus (min)</label>
          <input type="number" id="s-cfg-focus" value="${S.pomCfg.focus}" min="1" max="90">
        </div>
        <div class="timer-cfg-row">
          <label>Short break (min)</label>
          <input type="number" id="s-cfg-short" value="${S.pomCfg.shortBreak}" min="1" max="30">
        </div>
        <div class="timer-cfg-row">
          <label>Long break (min)</label>
          <input type="number" id="s-cfg-long" value="${S.pomCfg.longBreak}" min="1" max="60">
        </div>
        <div class="timer-cfg-row">
          <label>Streak (cycles)</label>
          <input type="number" id="s-cfg-streak" value="${S.pomCfg.streakLength}" min="2" max="10">
        </div>
      </div>
      <button class="btn btn-primary btn-full" id="m-save-pom" style="margin-top:12px">Save Pomodoro</button>
    </div>

    <p class="text2" style="font-size:12px">
      Data encrypted with AES-256-GCM. The key never leaves your device.
    </p>

    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-danger btn-full" id="m-clear-all">Delete all data</button>
      <button class="btn btn-ghost btn-full" id="m-cancel">Close</button>
    </div>
  `);

  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-save-pom').onclick = () => {
    S.pomCfg.focus        = Math.max(1, parseInt(document.getElementById('s-cfg-focus').value)  || 25);
    S.pomCfg.shortBreak   = Math.max(1, parseInt(document.getElementById('s-cfg-short').value)  || 5);
    S.pomCfg.longBreak    = Math.max(1, parseInt(document.getElementById('s-cfg-long').value)   || 15);
    S.pomCfg.streakLength = Math.max(2, parseInt(document.getElementById('s-cfg-streak').value) || 4);
    if (S.pomState === 'idle') S.pomSeconds = S.pomCfg.focus * 60;
    localStorage.setItem(SK.POM_CFG, JSON.stringify(S.pomCfg));
    toast('Pomodoro settings saved', 'success');
    closeModal();
  };
  document.getElementById('m-clear-all').onclick = () => {
    if (!confirm('Delete ALL data? This cannot be undone.')) return;
    if (!confirm('Are you sure? All projects, tasks and sessions will be erased.')) return;
    [SK.TASKS, SK.PROJECTS, SK.SESSIONS].forEach(k => localStorage.removeItem(k));
    closeModal();
    zeroise();
    toast('All data deleted', 'info');
  };
}
