
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R1DO Tasks</title>
  <meta name="description" content="End-to-end encrypted task management with WebAuthn PRF">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f1a;
      --surface:   #1a1a2e;
      --surface2:  #22223a;
      --surface3:  #2a2a45;
      --border:    #2e2e50;
      --text:      #e2e8f0;
      --text2:     #94a3b8;
      --text3:     #64748b;
      --accent:    #8b5cf6;
      --accent-h:  #7c3aed;
      --accent-s:  #a78bfa;
      --green:     #10b981;
      --yellow:    #f59e0b;
      --red:       #ef4444;
      --orange:    #f97316;
      --radius:    8px;
      --radius-lg: 12px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ── */
    .screen { display: flex; height: 100vh; }
    .screen.hidden { display: none !important; }

    /* ── Auth ── */
    #auth-screen {
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, #1a1040 0%, var(--bg) 70%);
    }
    .auth-wrap {
      width: 100%;
      max-width: 420px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .auth-logo {
      text-align: center;
    }
    .auth-logo .logo-glyph {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 12px;
      display: block;
      filter: drop-shadow(0 0 20px #8b5cf680);
    }
    .auth-logo h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-logo p {
      color: var(--text2);
      font-size: 13px;
      margin-top: 4px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-badges {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 0.3px;
    }
    .badge.accent {
      background: #1e1040;
      border-color: var(--accent);
      color: var(--accent-s);
    }
    .compat-warn {
      background: #2d1a00;
      border: 1px solid var(--yellow);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 13px;
      color: var(--yellow);
      line-height: 1.6;
    }

    /* ── App layout ── */
    #app-screen { overflow: hidden; }

    #sidebar {
      width: 280px;
      min-width: 280px;
      height: 100vh;
      overflow-y: auto;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    #main {
      flex: 1;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ── Sidebar ── */
    .sb-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      min-height: 56px;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .user-name {
      flex: 1;
      font-weight: 600;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .sb-section {
      padding: 12px 8px 4px;
    }
    .sb-section-header {
      display: flex;
      align-items: center;
      padding: 0 8px 6px;
      gap: 4px;
    }
    .sb-section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: var(--text3);
      flex: 1;
      text-transform: uppercase;
    }
    .sb-tasks-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sb-tasks-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 8px;
    }

    .project-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .project-item:hover { background: var(--surface2); }
    .project-item.selected { background: var(--surface3); }
    .project-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .project-label {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .count-badge {
      background: var(--surface3);
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 11px;
      color: var(--text2);
      flex-shrink: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .task-item:hover { background: var(--surface2); }
    .task-item.selected { background: var(--surface3); }
    .task-check-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }
    .task-item.status-done .task-check-icon {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }
    .task-item.status-in_progress .task-check-icon {
      border-color: var(--accent);
    }
    .task-item-label {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-item.status-done .task-item-label { text-decoration: line-through; color: var(--text3); }
    .prio-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .prio-dot.p1 { background: var(--text2); }
    .prio-dot.p2 { background: var(--yellow); }
    .prio-dot.p3 { background: var(--red); }

    .sb-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
    }

    /* ── Main content areas ── */
    .welcome-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text2);
      padding: 40px;
    }
    .welcome-glyph {
      font-size: 56px;
      opacity: 0.3;
    }
    .welcome-view h2 { font-size: 20px; color: var(--text); }
    .welcome-view p { font-size: 14px; text-align: center; max-width: 300px; }

    .project-overview {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }
    .proj-overview-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }
    .proj-dot-lg {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .proj-overview-header h2 { font-size: 22px; font-weight: 700; }
    .proj-overview-header .sub { color: var(--text2); font-size: 13px; margin-top: 2px; }
    .proj-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    .progress-bar-wrap {
      height: 4px;
      background: var(--surface3);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .progress-label { font-size: 12px; color: var(--text2); margin-bottom: 20px; }

    .tasks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .task-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }
    .task-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .task-card.status-done { opacity: 0.6; }
    .task-card-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .status-pill {
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-pill.todo { background: var(--surface3); color: var(--text2); }
    .status-pill.in_progress { background: #1e1040; color: var(--accent-s); }
    .status-pill.done { background: #0d2a1f; color: var(--green); }
    .status-pill.archived { background: var(--surface3); color: var(--text3); }

    .prio-pill {
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .prio-pill.p1 { background: var(--surface3); color: var(--text2); }
    .prio-pill.p2 { background: #2d2200; color: var(--yellow); }
    .prio-pill.p3 { background: #2d1010; color: var(--red); }

    .task-card-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
    .task-card-meta { font-size: 12px; color: var(--text2); display: flex; gap: 12px; }

    /* Timer panel toggle — desktop: always expanded, no toggle visible */
    .timer-panel-toggle { display: none; }
    .timer-panel-body { padding: 24px 20px; }

    /* ── Task detail layout ── */
    .task-detail-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 28px 28px 40px;
    }
    .timer-panel {
      width: 300px;
      min-width: 300px;
      height: 100vh;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
    }

    .task-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 12px;
    }
    .task-breadcrumb .bc-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .task-title-edit {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      outline: none;
      border: none;
      background: transparent;
      width: 100%;
      resize: none;
      line-height: 1.3;
      margin-bottom: 16px;
      border-radius: var(--radius);
      padding: 4px 0;
    }
    .task-title-edit:focus {
      background: var(--surface2);
      padding: 4px 8px;
    }

    .task-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .meta-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text3);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .pomo-track {
      margin-bottom: 20px;
    }
    .pomo-track label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text3);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .pomo-dots {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
    }
    .pomo-dot {
      font-size: 18px;
      opacity: 0.3;
      line-height: 1;
    }
    .pomo-dot.done { opacity: 1; }

    .notes-section { margin-bottom: 20px; }
    .notes-section label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text3);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .subtasks-section { margin-bottom: 20px; }
    .subtasks-section .sh {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .subtasks-section .sh label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text3);
      text-transform: uppercase;
      flex: 1;
    }
    .subtask-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .subtask-item:last-child { border-bottom: none; }
    .subtask-title {
      flex: 1;
      font-size: 13px;
    }
    .subtask-title.done { text-decoration: line-through; color: var(--text3); }

    .task-actions-row {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* ── Pomodoro timer ── */
    .timer-phase-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text3);
      text-align: center;
      margin-bottom: 12px;
    }
    .timer-display {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 80px;
      font-weight: 200;
      text-align: center;
      letter-spacing: -3px;
      color: var(--text);
      margin-bottom: 20px;
      line-height: 1;
      padding: 16px 0;
    }
    .timer-display.break { color: var(--green); }
    .timer-display.idle { color: var(--text2); }
    .timer-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .timer-session-info {
      text-align: center;
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 20px;
    }
    .timer-sep {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }
    .timer-cfg {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timer-cfg-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timer-cfg-row label {
      flex: 1;
      font-size: 12px;
      color: var(--text2);
    }
    .timer-cfg-row input {
      width: 56px;
    }
    .timer-sessions-log {
      margin-top: 16px;
    }
    .timer-sessions-log label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text3);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .session-log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text2);
    }
    .session-log-item:last-child { border-bottom: none; }
    .session-quality {
      display: flex;
      gap: 2px;
    }
    .quality-star { color: var(--yellow); font-size: 10px; }

    /* ── Form controls ── */
    input[type="text"],
    input[type="number"],
    input[type="date"],
    textarea,
    select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 7px 10px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: var(--text3); }
    textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
    select { cursor: pointer; }
    select option { background: var(--surface2); }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, opacity 0.1s;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }

    .btn-secondary {
      background: var(--surface3);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--surface2); }

    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border-color: transparent;
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface2); color: var(--text); }

    .btn-danger {
      background: var(--red);
      color: white;
      border-color: var(--red);
    }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }

    .btn-danger-ghost {
      background: transparent;
      color: var(--red);
      border-color: transparent;
    }
    .btn-danger-ghost:hover:not(:disabled) { background: #2d1010; }

    .btn-icon {
      padding: 5px;
      width: 28px;
      height: 28px;
      border-radius: var(--radius);
    }
    .btn-large {
      padding: 11px 20px;
      font-size: 14px;
    }
    .btn-full { width: 100%; }

    /* ── Toast ── */
    #toast-root {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      pointer-events: none;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      max-width: 320px;
      box-shadow: 0 4px 20px #00000060;
      animation: slideIn 0.2s ease;
      pointer-events: auto;
    }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red);   }
    .toast.warning { border-color: var(--yellow); color: var(--yellow); }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ── Modal ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: #00000080;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9000;
      backdrop-filter: blur(2px);
    }
    #modal-overlay.hidden { display: none; }
    #modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 60px #00000080;
    }
    #modal-box h3 {
      font-size: 16px;
      font-weight: 700;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .color-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s;
    }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.selected { border-color: white; }

    .quality-grid {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .quality-btn {
      width: 52px;
      height: 52px;
      border-radius: var(--radius);
      background: var(--surface2);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s;
      font-family: inherit;
    }
    .quality-btn:hover { border-color: var(--accent); background: var(--surface3); }
    .quality-label { text-align: center; font-size: 12px; color: var(--text2); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    /* ── Misc ── */
    .divider { height: 1px; background: var(--border); margin: 4px 0; }
    .empty-hint { font-size: 12px; color: var(--text3); padding: 6px 10px; }
    .text2 { color: var(--text2); }
    .text3 { color: var(--text3); }

<body>

<!-- ════════════════════════ AUTH SCREEN ════════════════════════ -->

<script type="module">
/* ═══════════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════════ */
import * as R1DO from './js/r1do-auth.js';

const INBOX_ID = '__inbox__'; // virtual project for tasks with projectId === null
const INBOX_PROJ = { id: INBOX_ID, name: 'Tasks', color: '#64748b' };

const SK = { // storage keys
  TASKS      : 'r1do_tasks',
  PROJECTS   : 'r1do_projects',
  SESSIONS   : 'r1do_sessions',
  POM_CFG    : 'r1do_pom_cfg',
};

const COLORS = ['#8b5cf6','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899','#06b6d4','#f97316'];

/* ═══════════════════════════════════════════════════════════
   APP STATE
═══════════════════════════════════════════════════════════ */
const S = {
  // Crypto
  dek: null,           // CryptoKey | null  (AES-256-GCM, non-extractable)

  // Data
  projects: [],
  tasks: [],
  sessions: [],

  // UI selection
  selectedProjectId: null,
  selectedTaskId: null,
  view: 'dashboard',       // 'dashboard' | 'project' | 'completed' | 'stats'
  statsPeriod: 30,         // days: 7 | 30 | 90 | 0 (all)
  showArchived: false,
  showCompleted: false,
  projectTab: 'tasks',     // 'tasks' | 'warboard' | 'stats'
  warboardMode: 'kanban',  // 'kanban' | 'matrix'

  // Pomodoro
  pomState: 'idle',    // idle | focus | short_break | long_break | paused
  pomSeconds: 25 * 60,
  pomInterval: null,
  pomCurrentSession: null, // PomodoroSession being recorded
  pomCount: 0,         // focus cycles completed in current streak
  pomCfg: {
    focus:       25,
    shortBreak:  5,
    longBreak:   15,
    streakLength: 4,
  },

  userName: '',
};

/* ═══════════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════════ */
function uid() { return crypto.randomUUID(); }
function iso() { return new Date().toISOString(); }

function fmtTime(s) {
  const m = String(Math.floor(s / 60)).padStart(2,'0');
  const ss = String(s % 60).padStart(2,'0');
  return `${m}:${ss}`;
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

function statusLabel(s) {
  return { todo:'To do', in_progress:'In progress', done:'Completed', archived:'Archived' }[s] ?? s;
}

function prioLabel(p) {
  return ['—','Low','Medium','Urgent'][p] ?? '—';
}

function toast(msg, type = 'info', dur = 3000) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), dur);
}

/* ═══════════════════════════════════════════════════════════
   CRYPTO MODULE
   DEK lives exclusively in RAM as a non-extractable CryptoKey.
   PRF output is zeroised immediately after key derivation.
═══════════════════════════════════════════════════════════ */
async function deriveKeysFromPRF(prfOutput) {
  // DEK: AES-256-GCM, non-extractable. Unified suite PRF + HKDF with the
  // tasks-specific info label (key tree independent from notes/chat/wallet).
  return R1DO.hkdfAesKey(prfOutput, R1DO.INFO.TASKS_DEK);
}

async function encryptData(plaintext) {
  if (!S.dek) throw new Error('Sesión bloqueada');

  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encoded = new TextEncoder().encode(JSON.stringify(plaintext));

  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    S.dek,
    encoded
  );

  // Store as plain JSON arrays (safe for localStorage)
  return {
    v:  1,
    iv: Array.from(iv),
    ct: Array.from(new Uint8Array(ciphertext)),
  };
}

async function decryptData(blob) {
  if (!S.dek) throw new Error('Sesión bloqueada');
  if (!blob?.iv || !blob?.ct) throw new Error('Blob inválido');

  const iv         = new Uint8Array(blob.iv);
  const ciphertext = new Uint8Array(blob.ct);

  const plaintext = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv },
    S.dek,
    ciphertext
  );

  return JSON.parse(new TextDecoder().decode(plaintext));
}

function zeroise() {
  // CryptoKey is non-extractable; dropping the reference is the best we can do in JS.
  // PRF output raw bytes are zeroised immediately after deriveKeysFromPRF().
  S.dek = null;
  S.projects = [];
  S.tasks = [];
  S.sessions = [];
  S.selectedProjectId = null;
  S.selectedTaskId = null;
  S.view = 'dashboard';
  S.showArchived = false;

/* ═══════════════════════════════════════════════════════════
   AUTH MODULE  (WebAuthn PRF — IndexedDB credential store)
═══════════════════════════════════════════════════════════ */

// ── Credential store: shared R1DOToolsDB via js/r1do-auth.js ──
// Internal format: { id, rawId, userName }

async function _idbGetAllCreds() {
  const records = await R1DO.listCredentials();
  return records.map(r => ({
    id:       r.credentialId,
    rawId:    r.credentialIdRaw,
    userName: r.username,
  }));
}

// Delete by credentialId
const _idbDeleteCred = (credentialId) => R1DO.deleteCredentialById(credentialId);

// ── WebAuthn ──
async function register(userName) {
  try {
    const { credentialId } = await R1DO.registerPasskey(userName);
    return credentialId; // so caller can auto-login
  } catch (e) {
    throw new Error('Registro cancelado: ' + e.message);
  }
}

// credId: optional — authenticate a specific credential (by id)
async function authenticate(credId) {
  let result;
  try {
    result = await R1DO.authenticate({
      credentialId: credId ?? null,
    });
  } catch (e) {
    throw new Error('Autenticación cancelada: ' + e.message);
  }

  S.dek = await deriveKeysFromPRF(result.prfOutput);

  R1DO.zeroize(result.prfOutput); // zeroise PRF material immediately

  S.userName = result.username ?? 'Usuario';
  return S.userName;
}

function checkWebAuthnSupport() {
  if (!window.PublicKeyCredential) return 'sin-webauthn';
  return 'ok';
}

/* ═══════════════════════════════════════════════════════════
   STORAGE MODULE
   All entity payloads are AES-256-GCM blobs.
   Only metadata (id, timestamp) is stored in clear.
═══════════════════════════════════════════════════════════ */
async function loadAllData() {
  const rawTasks    = JSON.parse(localStorage.getItem(SK.TASKS)    ?? '[]');
  const rawProjects = JSON.parse(localStorage.getItem(SK.PROJECTS) ?? '[]');
  const rawSessions = JSON.parse(localStorage.getItem(SK.SESSIONS) ?? '[]');

  const decryptList = async (list) => {
    const results = [];
    for (const r of list) {
      try { results.push(await decryptData(r.enc)); }
      catch { /* skip corrupted records */ }
    }
    return results;
  };

  S.projects = await decryptList(rawProjects);
  S.tasks    = await decryptList(rawTasks);
  S.sessions = await decryptList(rawSessions);

  // Load persisted pomodoro config
  const savedCfg = JSON.parse(localStorage.getItem(SK.POM_CFG) ?? 'null');
  if (savedCfg) Object.assign(S.pomCfg, savedCfg);
  if (S.pomState === 'idle') S.pomSeconds = S.pomCfg.focus * 60;
}

async function _upsert(storageKey, stateArray, entity) {
  entity.modifiedAt = iso();
  const enc    = await encryptData(entity);
  const record = { id: entity.id, ts: entity.modifiedAt, enc };

  const raw = JSON.parse(localStorage.getItem(storageKey) ?? '[]');
  const idx = raw.findIndex(r => r.id === entity.id);
  if (idx >= 0) raw[idx] = record; else raw.push(record);
  localStorage.setItem(storageKey, JSON.stringify(raw));

  const si = stateArray.findIndex(e => e.id === entity.id);
  if (si >= 0) stateArray[si] = entity; else stateArray.push(entity);
}

async function _delete(storageKey, stateArray, id) {
  const raw = JSON.parse(localStorage.getItem(storageKey) ?? '[]');
  localStorage.setItem(storageKey, JSON.stringify(raw.filter(r => r.id !== id)));
  const idx = stateArray.findIndex(e => e.id === id);
  if (idx >= 0) stateArray.splice(idx, 1);
}

const saveProject = (p) => _upsert(SK.PROJECTS, S.projects, p);
const saveTask    = (t) => _upsert(SK.TASKS,    S.tasks,    t);

async function saveSession(sess) {
  sess.modifiedAt = iso();
  const enc    = await encryptData(sess);
  const record = { id: sess.id, ts: sess.startedAt, enc };
  const raw = JSON.parse(localStorage.getItem(SK.SESSIONS) ?? '[]');
  raw.push(record);
  localStorage.setItem(SK.SESSIONS, JSON.stringify(raw));
  S.sessions.push(sess);
}

async function deleteTask(id) {
  await _delete(SK.TASKS, S.tasks, id);
}

async function deleteProject(id) {
  await _delete(SK.PROJECTS, S.projects, id);
  // Cascade: delete project tasks
  const ids = S.tasks.filter(t => t.projectId === id).map(t => t.id);
  for (const tid of ids) await deleteTask(tid);
}

/* ═══════════════════════════════════════════════════════════
   POMODORO MODULE
═══════════════════════════════════════════════════════════ */
function effectivePomCfg() {
  const task = S.tasks.find(t => t.id === S.selectedTaskId);
  return task?.pomCfg ? { ...S.pomCfg, ...task.pomCfg } : S.pomCfg;
}

function stopPomodoro() {
  clearInterval(S.pomInterval);
  S.pomInterval = null;
  S.pomState = 'idle';
  S.pomCurrentSession = null;
  S.pomCount = 0;
  S.pomSeconds = effectivePomCfg().focus * 60;
}

function startPomodoro(taskId) {
  const cfg = effectivePomCfg();
  if (S.pomState === 'idle') {
    S.pomState = 'focus';
    S.pomSeconds = cfg.focus * 60;
    S.pomCurrentSession = {
      id: uid(),
      taskId,
      type: 'focus',
      durationSeconds: cfg.focus * 60,
      startedAt: iso(),
      endedAt: null,
      completed: false,
      interruptionCount: 0,
      focusQualityScore: null,
    };
  } else if (S.pomState === 'paused') {
    S.pomState = 'focus';
  }
  S.pomInterval = setInterval(() => tickPomodoro(taskId), 1000);
  renderTimer();
}

function pausePomodoro() {
  if (S.pomState !== 'focus') return;
  clearInterval(S.pomInterval);
  S.pomInterval = null;
  if (S.pomCurrentSession) S.pomCurrentSession.interruptionCount++;
  S.pomState = 'paused';
  renderTimer();
}

async function skipPomodoro(taskId) {
  clearInterval(S.pomInterval);
  S.pomInterval = null;

  if (S.pomState === 'focus' && S.pomCurrentSession) {
    S.pomCurrentSession.completed = false;
    S.pomCurrentSession.endedAt = iso();
    S.pomCurrentSession.durationSeconds = Math.round((new Date(S.pomCurrentSession.endedAt) - new Date(S.pomCurrentSession.startedAt)) / 1000);
    await saveSession({ ...S.pomCurrentSession });
    S.pomCurrentSession = null;
  }

  if (S.pomState === 'short_break' || S.pomState === 'long_break') {
    S.pomState = 'idle';
    S.pomSeconds = effectivePomCfg().focus * 60;
    S.pomCount = 0;
  } else {
    S.pomState = 'idle';
    S.pomSeconds = effectivePomCfg().focus * 60;
  }
  renderTimer();
}

async function tickPomodoro(taskId) {
  S.pomSeconds--;

  if (S.pomSeconds <= 0) {
    await completePomodoroPhase(taskId);
  }
  renderTimer();
}

function playPomSound(type) {
  try {
    const ctx = new AudioContext();
    const sequences = {
      // Focus done: three ascending soft tones
      focus: [
        { freq: 523.25, start: 0,    dur: 0.18, gain: 0.35 }, // C5
        { freq: 659.25, start: 0.2,  dur: 0.18, gain: 0.35 }, // E5
        { freq: 783.99, start: 0.4,  dur: 0.30, gain: 0.40 }, // G5
      ],
      // Break done: two gentle descending tones
      break: [
        { freq: 659.25, start: 0,   dur: 0.18, gain: 0.30 }, // E5
        { freq: 523.25, start: 0.22, dur: 0.28, gain: 0.30 }, // C5
      ],
    };
    for (const { freq, start, dur, gain } of (sequences[type] ?? sequences.focus)) {
      const osc  = ctx.createOscillator();
      const env  = ctx.createGain();
      osc.type      = 'sine';
      osc.frequency.value = freq;
      env.gain.setValueAtTime(0, ctx.currentTime + start);
      env.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.01);
      env.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.connect(env);
      env.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    }
    setTimeout(() => ctx.close(), 1500);
  } catch { /* AudioContext not available */ }
}

async function completePomodoroPhase(taskId) {
  clearInterval(S.pomInterval);
  S.pomInterval = null;

  if (S.pomState === 'focus') {
    S.pomCount++;

    if (S.pomCurrentSession) {
      S.pomCurrentSession.completed = true;
      S.pomCurrentSession.endedAt = iso();
      S.pomCurrentSession.durationSeconds = Math.round((new Date(S.pomCurrentSession.endedAt) - new Date(S.pomCurrentSession.startedAt)) / 1000);
      const sess = { ...S.pomCurrentSession };
      S.pomCurrentSession = null;
      await saveSession(sess);

      // Increment task completed pomodoros
      const task = S.tasks.find(t => t.id === taskId);
      if (task) {
        task.completedPomodoros = (task.completedPomodoros ?? 0) + 1;
        await saveTask(task);
        // Re-render task detail pomodoro dots
        const dotsEl = document.getElementById('pomo-dots');
        if (dotsEl) dotsEl.innerHTML = buildPomoDots(task);
        const countEl = document.getElementById('pomo-count');
        if (countEl) countEl.textContent = `${task.completedPomodoros} completed`;
      }

      // Ask quality score
      showQualityScoreModal(sess.id);
    }

    // Determine next phase
    const cfg2 = effectivePomCfg();
    const isLongBreak = S.pomCount % cfg2.streakLength === 0;
    playPomSound('focus');
    if (isLongBreak) {
      S.pomState = 'long_break';
      S.pomSeconds = cfg2.longBreak * 60;
      toast('Streak complete! Take a long break.', 'success');
    } else {
      S.pomState = 'short_break';
      S.pomSeconds = cfg2.shortBreak * 60;
      toast('Pomodoro complete! Take a short break.', 'success');
    }

    // Auto-start break
    S.pomInterval = setInterval(() => tickPomodoro(taskId), 1000);

  } else {
    // Break ended
    playPomSound('break');
    S.pomState = 'idle';
    S.pomSeconds = effectivePomCfg().focus * 60;
    toast('Break over. Ready to focus!', 'info');
  }
}

function buildPomoDots(task) {
  const done = task.completedPomodoros ?? 0;
  if (done === 0) return '<span class="text3">No sessions yet</span>';
  return Array.from({ length: done }, () => `<span class="pomo-dot done">🍅</span>`).join('');
}

async function renderAuthCard() {
  const slot    = document.getElementById('auth-card-slot');
  const support = checkWebAuthnSupport();

  if (support === 'sin-webauthn') {
    slot.innerHTML = `
      <div class="compat-warn">
        <strong>Browser not supported</strong><br>
        WebAuthn is not available. Use Chrome 132+, Safari 17.4+ or Firefox 130+.<br>
        Access via <code>http://localhost</code> (not by IP).
      </div>`;
    return;
  }

  const creds = await _idbGetAllCreds();

  if (creds.length > 0) {
    slot.innerHTML = `
      <div class="auth-card">
        <p class="text2" style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:600">Registered accounts</p>
        <div id="cred-list" style="display:flex;flex-direction:column;gap:8px">
          ${creds.map(c => `
            <div style="display:flex;align-items:center;gap:10px;background:var(--surface3);border-radius:var(--radius);padding:10px 12px">
              <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">
                ${escHtml(c.userName.charAt(0).toUpperCase())}
              </div>
              <span style="flex:1;font-size:14px;font-weight:500">${escHtml(c.userName)}</span>
              <button class="btn btn-primary" data-cid="${escHtml(c.id)}" style="padding:5px 12px;font-size:12px">
                Sign in
              </button>
            </div>`).join('')}
        </div>
        <button class="btn btn-ghost btn-full" id="btn-add-account" style="font-size:13px;margin-top:4px">
          + Add another account
        </button>
      </div>`;

    slot.querySelectorAll('[data-cid]:not(.del-cred)').forEach(btn => {
      btn.onclick = () => handleLogin(btn.dataset.cid);
    });
    document.getElementById('btn-add-account').onclick = showRegisterForm;
  } else {
    showRegisterForm();
  }
}

function showRegisterForm() {
  const slot = document.getElementById('auth-card-slot');
  slot.innerHTML = `
    <div class="auth-card">
      <p class="text2">Create your account with biometrics. No passwords, no servers.</p>
      <div class="input-group">
        <label for="input-name">Your name</label>
        <input id="input-name" type="text" placeholder="e.g. John Doe" maxlength="50" autocomplete="name">
      </div>
      <button class="btn btn-primary btn-large btn-full" id="btn-register">
        Create account with Passkey
      </button>
      <button class="btn btn-ghost btn-full" id="btn-back-to-list" style="font-size:12px">← Back</button>
    </div>`;
  const inp = document.getElementById('input-name');
  document.getElementById('btn-register').onclick = handleRegister;
  inp.onkeydown = e => { if (e.key === 'Enter') handleRegister(); };
  document.getElementById('btn-back-to-list').onclick = renderAuthCard;
  inp.focus();
}

async function handleRegister() {
  const inp  = document.getElementById('input-name');
  const name = inp?.value?.trim();
  if (!name) { toast('Enter your name', 'error'); return; }

  const btn = document.getElementById('btn-register');
  btn.disabled = true;
  btn.textContent = 'Creating account…';

  try {
    const credId = await register(name);
    // Auto-login immediately after registration
    btn.textContent = 'Signing in…';
    const userName = await authenticate(credId);
    await loadAllData();
    showAppScreen();
    toast(`Welcome, ${userName}`, 'success');
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Create account with Passkey';
  }
}

async function handleLogin(credId) {
  // Disable the clicked button
  const btn = credId
    ? document.querySelector(`[data-cid="${CSS.escape(credId)}"]:not(.del-cred)`)
    : document.getElementById('btn-unlock');
  if (btn) { btn.disabled = true; btn.textContent = 'Verifying…'; }

  try {
    const name = await authenticate(credId);
    await loadAllData();
    showAppScreen();
    toast(`Welcome, ${name}`, 'success');
  } catch (e) {
    toast(e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Sign in'; }
  }
}

  if (mobileTitle) mobileTitle.textContent = 'R1DO Tasks';
  if (mobileNewTask) mobileNewTask.style.display = 'none';
  renderDashboard(main);
}

function renderDashboard(main) {
  const today = new Date().toISOString().slice(0, 10);

  // Tasks for today: in_progress, or due today/overdue (not done/archived)
  const activeTasks = S.tasks.filter(t => {
    if (t.status === 'archived' || t.status === 'done') return false;
    if (t.status === 'in_progress') return true;
    if (t.dueDate && t.dueDate <= today) return true;
    return false;
  });

  // Group by project, sort by priority desc within each group
  const byProject = {};
  for (const task of activeTasks) {
    if (!byProject[task.projectId]) byProject[task.projectId] = [];
    byProject[task.projectId].push(task);
  }
  for (const tasks of Object.values(byProject)) {
    tasks.sort((a, b) => b.priority - a.priority);
  }

  const totalPending  = S.tasks.filter(t => t.status === 'todo' || t.status === 'in_progress').length;
  const dueToday      = S.tasks.filter(t => t.dueDate === today && t.status !== 'done' && t.status !== 'archived').length;
  const inProgress    = S.tasks.filter(t => t.status === 'in_progress').length;
  const doneTotal     = S.tasks.filter(t => t.status === 'done').length;

  const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' });

  const groupsHTML = Object.entries(byProject).map(([pid, tasks]) => {
    const proj = S.projects.find(p => p.id === pid) ?? (pid === 'null' || pid === null ? INBOX_PROJ : null);
    if (!proj) return '';
    return `
      <div class="dash-group">
        <div class="dash-group-header">
          <span class="project-dot" style="background:${proj.color}"></span>
          <span class="dash-group-name">${escHtml(proj.name)}</span>
          <span class="count-badge">${tasks.length}</span>
        </div>
        ${tasks.map(t => {
          const isOverdue  = t.dueDate && t.dueDate < today;
          const isDueToday = t.dueDate === today;
          return `
            <div class="dash-task-row" data-tid="${t.id}" data-pid="${t.projectId}">
              <button class="dash-complete-btn" data-tid="${t.id}" title="Mark as completed">✓</button>
              <div class="dash-task-title-wrap" data-tid="${t.id}" data-pid="${t.projectId}">
                <span class="dash-task-title">${escHtml(t.title)}</span>
                <div class="dash-task-meta">
                  ${t.priority > 0 ? `<span class="prio-pill p${t.priority}">${prioLabel(t.priority)}</span>` : ''}
                  ${isOverdue  ? `<span class="dash-overdue">Overdue</span>` : ''}
                  ${isDueToday ? `<span class="dash-today">Today</span>` : ''}
                  ${t.dueDate && !isOverdue && !isDueToday ? `<span class="dash-due">📅 ${t.dueDate}</span>` : ''}
                </div>
              </div>
              <span class="status-pill ${t.status}" style="flex-shrink:0">${statusLabel(t.status)}</span>
            </div>`;
        }).join('')}
      </div>`;
  }).join('');

  main.innerHTML = `
    <div class="dashboard">
      <div class="dash-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div>
          <h2 class="dash-title">Hello, ${escHtml(S.userName.split(' ')[0])}</h2>
          <p class="dash-date">${dateStr}</p>
        </div>
        <button class="btn btn-primary" id="btn-dash-new-task" style="flex-shrink:0;margin-top:4px">+ New task</button>
      </div>

      <div class="dash-stats">
        <div class="dash-stat">
          <span class="dash-stat-num">${activeTasks.length}</span>
          <span class="dash-stat-label">For today</span>
        </div>
        <div class="dash-stat">
          <span class="dash-stat-num">${inProgress}</span>
          <span class="dash-stat-label">In progress</span>
        </div>
        <div class="dash-stat">
          <span class="dash-stat-num">${totalPending}</span>
          <span class="dash-stat-label">Pending</span>
        </div>
        <div class="dash-stat">
          <span class="dash-stat-num">${doneTotal}</span>
          <span class="dash-stat-label">Completed</span>
        </div>
      </div>

      ${activeTasks.length === 0 ? `
        <div class="dash-empty">
          <div style="font-size:48px;opacity:.3">✓</div>
          <h3>All caught up</h3>
          <p>No urgent or overdue tasks. ${S.projects.length === 0 ? 'Create your first project to get started.' : ''}</p>
          ${S.projects.length === 0 ? `<button class="btn btn-primary" id="btn-dash-new-proj">+ New Project</button>` : ''}
        </div>
      ` : `
        <div class="dash-groups">${groupsHTML}</div>
      `}
    </div>`;

  const btnDashNewProj = document.getElementById('btn-dash-new-proj');
  if (btnDashNewProj) btnDashNewProj.onclick = showNewProjectModal;
  const btnDashNewTask = document.getElementById('btn-dash-new-task');
  if (btnDashNewTask) btnDashNewTask.onclick = showNewTaskModal;

  // Complete button — mark done without navigating
  main.querySelectorAll('.dash-complete-btn').forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      const task = S.tasks.find(t => t.id === btn.dataset.tid);
      if (!task) return;
      task.status = 'done';
      await saveTask(task);
      btn.closest('.dash-task-row').style.opacity = '0';
      btn.closest('.dash-task-row').style.transition = 'opacity 0.3s';
      setTimeout(() => renderDashboard(main), 320);
    };
  });

  // Click on title/info → navigate to task
  main.querySelectorAll('.dash-task-title-wrap').forEach(el => {
    el.onclick = () => {
      S.selectedProjectId = el.dataset.pid && el.dataset.pid !== 'null' ? el.dataset.pid : INBOX_ID;
      S.selectedTaskId    = el.dataset.tid;
      S.view = 'project';
      renderApp();
    };
  });
}

function fmtMinutes(mins) {
  if (!mins) return '';
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60), m = mins % 60;
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}

function renderCompletedView(main) {
  const done = S.tasks
    .filter(t => t.status === 'done')
    .sort((a, b) => (b.modifiedAt ?? '').localeCompare(a.modifiedAt ?? ''));

  const totalMins = done.reduce((acc, t) => acc + (t.manualMinutes ?? 0), 0)
    + S.sessions.filter(s => s.type === 'focus' && s.completed)
        .reduce((acc, s) => acc + Math.round((s.durationSeconds ?? 0) / 60), 0);

  const byProject = {};
  for (const task of done) {
    if (!byProject[task.projectId]) byProject[task.projectId] = [];
    byProject[task.projectId].push(task);
  }

  const groupsHTML = Object.entries(byProject).map(([pid, tasks]) => {
    const proj = S.projects.find(p => p.id === pid) ?? (pid === 'null' || pid === null ? INBOX_PROJ : null);
    return `
      <div style="margin-bottom:28px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">
          ${proj ? `<span class="project-dot" style="background:${proj.color}"></span><strong style="font-size:14px">${escHtml(proj.name)}</strong>` : '<strong style="font-size:14px">Tasks</strong>'}
          <span class="count-badge" style="margin-left:4px">${tasks.length}</span>
        </div>
        ${tasks.map(t => {
          const pomMins = S.sessions
            .filter(s => s.taskId === t.id && s.type === 'focus' && s.completed)
            .reduce((a, s) => a + Math.round((s.durationSeconds ?? 0) / 60), 0);
          const totalT = (t.manualMinutes ?? 0) + pomMins;
          return `
            <div class="task-item status-done" data-tid="${t.id}" data-pid="${t.projectId}" style="cursor:pointer">
              <span class="task-check-icon">✓</span>
              <span class="task-item-label">${escHtml(t.title)}</span>
              <span style="font-size:11px;color:var(--text3);flex-shrink:0;margin-left:auto;padding-left:8px">
                ${totalT > 0 ? `⏱ ${fmtMinutes(totalT)}` : ''}
              </span>
            </div>`;
        }).join('')}
      </div>`;
  }).join('');

  main.innerHTML = `
    <div class="project-overview">
      <div class="proj-overview-header" style="margin-bottom:20px">
        <div>
          <h2>Completed</h2>
          <p class="sub">${done.length} task${done.length !== 1 ? 's' : ''}${totalMins > 0 ? ` · ⏱ ${fmtMinutes(totalMins)} total` : ''}</p>
        </div>
        <div class="proj-actions">
          <button class="btn btn-primary" id="btn-log-done">+ Log task</button>
        </div>
      </div>
      ${done.length === 0 ? `
        <div style="text-align:center;padding:60px 20px;color:var(--text3)">
          No completed tasks. Use the button to log what you've done.
        </div>` : groupsHTML}
    </div>`;

  document.getElementById('btn-log-done').onclick = showLogDoneModal;

  main.querySelectorAll('.task-item').forEach(el => {
    el.onclick = () => {
      S.selectedProjectId = el.dataset.pid && el.dataset.pid !== 'null' ? el.dataset.pid : INBOX_ID;
      S.selectedTaskId    = el.dataset.tid;
      S.view = 'project';
      renderApp();
    };
  });
}

function showLogDoneModal() {
  const today = new Date().toISOString().slice(0, 10);
  const projectOptions = S.projects
    .filter(p => !p.archivedAt)
    .map(p => `<option value="${p.id}"${p.id === S.selectedProjectId ? ' selected' : ''}>${escHtml(p.name)}</option>`)
    .join('');

  showModal(`
    <h3>Log completed task</h3>
    <div class="input-group">
      <label>Project</label>
      <select id="m-log-proj">
        <option value="">Tasks (no project)</option>
        ${projectOptions}
      </select>
    </div>
    <div id="m-pending-list"></div>
    <div class="input-group">
      <label>Or type a new one</label>
      <input id="m-log-title" type="text" placeholder="Task description" maxlength="200">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="input-group">
        <label>Time spent (min)</label>
        <input id="m-log-mins" type="number" placeholder="e.g. 45" min="1" max="999">
      </div>
      <div class="input-group">
        <label>Date</label>
        <input id="m-log-date" type="date" value="${today}">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="m-cancel">Cancel</button>
      <button class="btn btn-primary" id="m-log-save">Save</button>
    </div>
  `);

  let selectedTaskId = null; // existing task picked from list

  function renderPendingList() {
    const projId  = document.getElementById('m-log-proj').value;
    const listEl  = document.getElementById('m-pending-list');
    const pending = projId
      ? S.tasks.filter(t => t.projectId === projId && (t.status === 'todo' || t.status === 'in_progress'))
      : S.tasks.filter(t => (t.projectId === null || t.projectId === undefined) && (t.status === 'todo' || t.status === 'in_progress'));

    if (pending.length === 0) { listEl.innerHTML = ''; return; }

    listEl.innerHTML = `
      <div style="margin-bottom:8px">
        <p style="font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--text3);text-transform:uppercase;margin-bottom:6px">Pending tasks in project</p>
        <div style="display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto">
          ${pending.map(t => `
            <div class="pending-pick" data-tid="${t.id}" style="
              display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);
              border:1.5px solid var(--border);cursor:pointer;transition:all .15s;font-size:13px
            ">
              <span style="width:10px;height:10px;border-radius:50%;background:${
                t.status === 'in_progress' ? 'var(--accent)' : 'var(--border)'
              };flex-shrink:0"></span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(t.title)}</span>
              ${t.priority > 0 ? `<span class="prio-pill p${t.priority}">${prioLabel(t.priority)}</span>` : ''}
            </div>`).join('')}
        </div>
      </div>`;

    listEl.querySelectorAll('.pending-pick').forEach(el => {
      el.onclick = () => {
        const tid  = el.dataset.tid;
        const task = S.tasks.find(t => t.id === tid);
        if (!task) return;
        // Toggle selection
        if (selectedTaskId === tid) {
          selectedTaskId = null;
          document.getElementById('m-log-title').value = '';
          document.getElementById('m-log-title').disabled = false;
          el.style.borderColor = 'var(--border)';
          el.style.background  = '';
        } else {
          selectedTaskId = tid;
          document.getElementById('m-log-title').value    = task.title;
          document.getElementById('m-log-title').disabled = true;
          // Highlight selected, reset others
          listEl.querySelectorAll('.pending-pick').forEach(e => {
            e.style.borderColor = 'var(--border)';
            e.style.background  = '';
          });
          el.style.borderColor = 'var(--green)';
          el.style.background  = '#0d2a1f';
        }
      };
    });
  }

  // Init list with pre-selected project
  renderPendingList();
  document.getElementById('m-log-proj').onchange = () => {
    selectedTaskId = null;
    document.getElementById('m-log-title').value    = '';
    document.getElementById('m-log-title').disabled = false;
    renderPendingList();
  };

  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-log-save').onclick = async () => {
    const mins = parseInt(document.getElementById('m-log-mins').value) || 0;
    const date = document.getElementById('m-log-date').value || today;

    if (selectedTaskId) {
      // Mark existing task as done
      const task = S.tasks.find(t => t.id === selectedTaskId);
      if (task) {
        task.status        = 'done';
        task.manualMinutes = (task.manualMinutes ?? 0) + (mins > 0 ? mins : 0) || null;
        task.dueDate       = task.dueDate ?? date;
        await saveTask(task);
        closeModal();
        const main = document.getElementById('main');
        renderCompletedView(main);
        toast('Task completed', 'success');
      }
    } else {
      const title = document.getElementById('m-log-title').value.trim();
      if (!title) { toast('Select a task or enter a description', 'error'); return; }
      const projId = document.getElementById('m-log-proj').value || null;
      await saveTask({
        id: uid(), projectId: projId, title, notes: '', status: 'done',
        priority: 0, estimatedPomodoros: 0, completedPomodoros: 0,
        manualMinutes: mins > 0 ? mins : null,
        startDate: date, dueDate: date,
        tags: [], subtasks: [], createdAt: iso(), modifiedAt: iso(),
      });
      closeModal();
      const main = document.getElementById('main');
      renderCompletedView(main);
      toast('Task logged', 'success');
    }
  };

  document.getElementById('m-log-title').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('m-log-save').click();
  };
}

function renderStatsView(main) {
  const days    = S.statsPeriod;
  const now     = new Date();
  const cutoff  = days > 0 ? new Date(now - days * 86400000) : null;
  const dayStr  = d => d.toISOString().slice(0, 10);

  const focusSessions = S.sessions.filter(s =>
    s.type === 'focus' && s.completed &&
    (!cutoff || new Date(s.startedAt) >= cutoff)
  );
  const doneTasks = S.tasks.filter(t =>
    t.status === 'done' &&
    (!cutoff || new Date(t.modifiedAt) >= cutoff)
  );

  // ── Stat cards ──
  const totalSecs   = focusSessions.reduce((a, s) => a + (s.durationSeconds ?? 0), 0)
                    + doneTasks.reduce((a, t) => a + ((t.manualMinutes ?? 0) * 60), 0);
  const totalH      = Math.floor(totalSecs / 3600);
  const totalM      = Math.floor((totalSecs % 3600) / 60);
  const timeStr     = totalH > 0 ? `${totalH}h ${totalM}m` : `${totalM}m`;

  const qualSess    = focusSessions.filter(s => s.focusQualityScore);
  const avgQuality  = qualSess.length
    ? (qualSess.reduce((a, s) => a + s.focusQualityScore, 0) / qualSess.length).toFixed(1)
    : '—';

  // Streak — consecutive days with at least one focus session
  const activityDays = new Set(
    S.sessions.filter(s => s.type === 'focus' && s.completed)
      .map(s => dayStr(new Date(s.startedAt)))
  );
  let streak = 0;
  const d = new Date(); d.setHours(0,0,0,0);
  while (activityDays.has(dayStr(d))) { streak++; d.setDate(d.getDate() - 1); }
  // If today has no activity, check if yesterday started the streak
  if (streak === 0) {
    const y = new Date(); y.setDate(y.getDate() - 1); y.setHours(0,0,0,0);
    while (activityDays.has(dayStr(y))) { streak++; y.setDate(y.getDate() - 1); }
  }

  // ── Tiempo por proyecto ──
  const projSecs = {};
  for (const s of focusSessions) {
    const task = S.tasks.find(t => t.id === s.taskId);
    const pid  = task?.projectId ?? '__none__';
    projSecs[pid] = (projSecs[pid] ?? 0) + (s.durationSeconds ?? 0);
  }
  for (const t of doneTasks) {
    if (t.manualMinutes) {
      const pid = t.projectId ?? '__none__';
      projSecs[pid] = (projSecs[pid] ?? 0) + t.manualMinutes * 60;
    }
  }
  const maxProjSecs = Math.max(1, ...Object.values(projSecs));
  const projBarsHTML = Object.entries(projSecs)
    .sort((a, b) => b[1] - a[1])
    .map(([pid, secs]) => {
      const proj = S.projects.find(p => p.id === pid);
      const pct  = Math.round(secs / maxProjSecs * 100);
      const h    = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
      const val  = h > 0 ? `${h}h ${m}m` : `${m}m`;
      return `
        <div class="proj-bar-row">
          <span class="proj-bar-name" title="${escHtml(proj?.name ?? 'No project')}">
            ${proj ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${proj.color};margin-right:6px;vertical-align:middle"></span>` : ''}${escHtml(proj?.name ?? 'No project')}
          </span>
          <div class="proj-bar-track">
            <div class="proj-bar-fill" style="width:${pct}%;background:${proj?.color ?? 'var(--accent)'}"></div>
          </div>
          <span class="proj-bar-val">${val}</span>
        </div>`;
    }).join('') || '<p class="empty-hint">No data for this period.</p>';

  // ── Heatmap — últimas 12 semanas (84 días) ──
  const WEEKS = 15;
  const DAYS  = WEEKS * 7;
  const heatStart = new Date(); heatStart.setDate(heatStart.getDate() - DAYS + 1); heatStart.setHours(0,0,0,0);

  // Build map: dateStr → total seconds
  const dayMap = {};
  for (const s of S.sessions.filter(s => s.type === 'focus' && s.completed)) {
    const k = dayStr(new Date(s.startedAt));
    dayMap[k] = (dayMap[k] ?? 0) + (s.durationSeconds ?? 0);
  }
  for (const t of S.tasks.filter(t => t.status === 'done' && t.manualMinutes)) {
    const k = dayStr(new Date(t.modifiedAt));
    dayMap[k] = (dayMap[k] ?? 0) + t.manualMinutes * 60;
  }

  const cells = [];
  let prevMonth = -1;
  const monthLabels = [];
  for (let i = 0; i < DAYS; i++) {
    const cd = new Date(heatStart); cd.setDate(cd.getDate() + i);
    const k  = dayStr(cd);
    const s  = dayMap[k] ?? 0;
    const h  = s / 3600;
    const level = h === 0 ? '' : h < 1 ? 'l1' : h < 2 ? 'l2' : h < 4 ? 'l3' : 'l4';
    cells.push(`<div class="hm-cell ${level}" title="${k}: ${fmtMinutes(Math.round(s/60))}"></div>`);
    const mo = cd.getMonth();
    if (mo !== prevMonth) { monthLabels.push({ col: Math.floor(i/7), label: cd.toLocaleDateString('en-US', { month: 'short' }) }); prevMonth = mo; }
  }
  const heatmapHTML = `<div class="heatmap">${cells.join('')}</div>`;

  // ── Calidad de foco — últimas 8 semanas ──
  const weekQuality = [];
  for (let w = 7; w >= 0; w--) {
    const wStart = new Date(); wStart.setDate(wStart.getDate() - w*7 - 6); wStart.setHours(0,0,0,0);
    const wEnd   = new Date(); wEnd.setDate(wEnd.getDate() - w*7 + 1);     wEnd.setHours(0,0,0,0);
    const wSess  = S.sessions.filter(s => s.type==='focus' && s.completed && s.focusQualityScore && new Date(s.startedAt) >= wStart && new Date(s.startedAt) < wEnd);
    const avg    = wSess.length ? wSess.reduce((a,s) => a+s.focusQualityScore,0)/wSess.length : 0;
    const label  = wStart.toLocaleDateString('en-US', { day:'numeric', month:'short' });
    weekQuality.push({ avg, label, count: wSess.length });
  }
  const maxQ = 5;
  const qualBarsHTML = weekQuality.map(w => `
    <div class="quality-bar-col">
      <span class="quality-bar-val">${w.avg > 0 ? w.avg.toFixed(1) : ''}</span>
      <div class="quality-bar-fill" style="height:${w.avg > 0 ? Math.round(w.avg/maxQ*60) : 3}px;opacity:${w.avg > 0 ? 0.4 + w.avg/maxQ*0.6 : 0.15}"></div>
      <span class="quality-bar-lbl">${w.label}</span>
    </div>`).join('');

  // ── Tareas por estado ──
  const statusCounts = { todo: 0, in_progress: 0, done: 0, archived: 0 };
  for (const t of S.tasks) statusCounts[t.status] = (statusCounts[t.status] ?? 0) + 1;
  const totalAllTasks = Math.max(1, Object.values(statusCounts).reduce((a,b) => a+b, 0));

  const periods = [{ v:7, l:'7d' }, { v:30, l:'30d' }, { v:90, l:'90d' }, { v:0, l:'All' }];

  main.innerHTML = `
    <div class="stats-view">
      <div class="stats-header">
        <h2>Metrics</h2>
        <div class="period-tabs">
          ${periods.map(p => `<button class="period-tab${S.statsPeriod===p.v?' active':''}" data-period="${p.v}">${p.l}</button>`).join('')}
        </div>
      </div>

      <div class="stats-cards">
        <div class="stat-card">
          <span class="stat-card-icon">⏱</span>
          <div class="stat-card-val">${timeStr}</div>
          <div class="stat-card-lbl">Focus time</div>
        </div>
        <div class="stat-card">
          <span class="stat-card-icon">✓</span>
          <div class="stat-card-val">${doneTasks.length}</div>
          <div class="stat-card-lbl">Tasks completed</div>
        </div>
        <div class="stat-card">
          <span class="stat-card-icon">🔥</span>
          <div class="stat-card-val">${streak}</div>
          <div class="stat-card-lbl">Day streak</div>
        </div>
        <div class="stat-card">
          <span class="stat-card-icon">★</span>
          <div class="stat-card-val">${avgQuality}</div>
          <div class="stat-card-lbl">Focus quality</div>
        </div>
      </div>

      <div class="stats-section">
        <p class="stats-section-title">Activity — last ${WEEKS} weeks</p>
        <div class="heatmap-wrap">${heatmapHTML}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11px;color:var(--text3)">
          Less

function renderProjectOverview(main) {
  const isInbox = S.selectedProjectId === INBOX_ID;
  const proj    = isInbox ? INBOX_PROJ : S.projects.find(p => p.id === S.selectedProjectId);
  if (!proj) { renderDashboard(main); return; }

  const allProjTasks = isInbox
    ? S.tasks.filter(t => t.projectId === null || t.projectId === undefined)
    : S.tasks.filter(t => t.projectId === proj.id);
  const tasks        = allProjTasks.filter(t => t.status !== 'archived' && t.status !== 'done');
  const completed    = allProjTasks.filter(t => t.status === 'done');
  const archived     = allProjTasks.filter(t => t.status === 'archived');
  const done         = completed.length;
  const pct          = (tasks.length + done) > 0 ? Math.round(done / (tasks.length + done) * 100) : 0;

  const taskCard = t => `
    <div class="task-card status-${t.status}" data-tid="${t.id}">
      <div class="task-card-top">
        <span class="status-pill ${t.status}">${statusLabel(t.status)}</span>
        ${t.priority > 0 ? `<span class="prio-pill p${t.priority}">${prioLabel(t.priority)}</span>` : ''}
      </div>
      <p class="task-card-title">${escHtml(t.title)}</p>
      <div class="task-card-meta">
        <span>🍅 ${t.completedPomodoros ?? 0}</span>
        ${t.startDate ? `<span>▷ ${t.startDate}</span>` : ''}
        ${t.dueDate   ? `<span>📅 ${t.dueDate}</span>` : ''}
        ${(t.subtasks?.length ?? 0) > 0 ? `<span>${t.subtasks.filter(s=>s.status==='done').length}/${t.subtasks.length} ✓</span>` : ''}
      </div>
    </div>`;

  const tabsHTML = `
    <div class="period-tabs" style="margin-bottom:20px">
      <button class="period-tab${S.projectTab==='tasks'?' active':''}" id="proj-tab-tasks">Tasks</button>
      <button class="period-tab${S.projectTab==='warboard'?' active':''}" id="proj-tab-warboard">War Board</button>
      <button class="period-tab${S.projectTab==='stats'?' active':''}" id="proj-tab-stats">Metrics</button>
    </div>`;

  const tasksHTML = `
    <div class="tasks-grid">
      ${tasks.map(taskCard).join('')}
      ${tasks.length === 0 ? `
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text3)">
          No tasks. Use the + button to create one.
        </div>` : ''}
    </div>
    ${completed.length > 0 ? `
      <div class="archived-toggle" id="toggle-completed">
        <span>${S.showCompleted ? '▼' : '▶'}</span>
        <span>Completed (${completed.length})</span>
      </div>
      ${S.showCompleted ? `<div class="tasks-grid">${completed.map(taskCard).join('')}</div>` : ''}
    ` : ''}
    ${archived.length > 0 ? `
      <div class="archived-toggle" id="toggle-archived">
        <span>${S.showArchived ? '▼' : '▶'}</span>
        <span>Archived (${archived.length})</span>
      </div>
      ${S.showArchived ? `<div class="tasks-grid">${archived.map(taskCard).join('')}</div>` : ''}
    ` : ''}`;

  main.innerHTML = `
    <div class="project-overview">
      <div class="proj-overview-header">
        <span class="proj-dot-lg" style="background:${proj.color}"></span>
        <div>
          <h2>${escHtml(proj.name)}</h2>
          <p class="sub">${(() => {
            let s = `${tasks.length} task${tasks.length !== 1 ? 's' : ''} &middot; ${done} completed`;
            if (proj.pomodoroWeeklyBudget) {
              const usedSecs   = weeklyFocusSecs(proj, allProjTasks);
              const budgetSecs = proj.pomodoroWeeklyBudget * 3600;
              const usedH = Math.floor(usedSecs / 3600), usedM = Math.floor((usedSecs % 3600) / 60);
              const usedStr = usedH > 0 ? `${usedH}h ${usedM}m` : `${usedM}m`;
              const pct = Math.min(100, Math.round(usedSecs / budgetSecs * 100));
              const over = usedSecs > budgetSecs;
              s += ` &middot; <span style="color:${over ? 'var(--red)' : 'var(--green)'}">${usedStr} / ${proj.pomodoroWeeklyBudget}h this week (${pct}%)</span>`;
            }
            return s;
          })()}</p>
        </div>
        <div class="proj-actions">
          ${!isInbox ? `
            <button class="btn btn-ghost" id="btn-edit-proj">Edit</button>
            <button class="btn btn-danger-ghost" id="btn-del-proj">Delete</button>
          ` : ''}
        </div>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
      <p class="progress-label">${pct}% completed</p>

      ${tabsHTML}

      <div id="proj-tab-body">
        ${S.projectTab === 'tasks' ? tasksHTML
          : S.projectTab === 'warboard' ? buildWarBoardHTML(allProjTasks)
          : buildProjectStatsHTML(proj, allProjTasks)}
      </div>
    </div>`;

  document.getElementById('btn-edit-proj')?.addEventListener('click', () => showEditProjectModal(proj));
  document.getElementById('btn-del-proj')?.addEventListener('click',  () => handleDeleteProject(proj.id));
  document.getElementById('proj-tab-tasks').onclick    = () => { S.projectTab = 'tasks';    renderProjectOverview(main); };
  document.getElementById('proj-tab-warboard').onclick = () => { S.projectTab = 'warboard'; renderProjectOverview(main); };
  document.getElementById('proj-tab-stats').onclick    = () => { S.projectTab = 'stats';    renderProjectOverview(main); };
  if (S.projectTab === 'warboard') wireWarBoard(main, allProjTasks);
  document.getElementById('toggle-completed')?.addEventListener('click', () => {
    S.showCompleted = !S.showCompleted;
    renderProjectOverview(main);
  });
  document.getElementById('toggle-archived')?.addEventListener('click', () => {
    S.showArchived = !S.showArchived;
    renderProjectOverview(main);
  });
  main.querySelectorAll('.task-card').forEach(el => {
    el.onclick = () => {
      S.selectedTaskId = el.dataset.tid;
      renderApp();
    };
  });
  // Task bar rows in stats tab → navigate to task
  main.querySelectorAll('.proj-bar-row[data-tid]').forEach(el => {
    el.onclick = () => {
      S.selectedTaskId = el.dataset.tid;
      renderApp();
    };
  });
}

function buildMatrixHTML(allProjTasks) {
  const QUADS = [
    { id: 'q1', label: '🔴 Do First',  desc: 'Urgent + Important',      cls: 'matrix-q1', urgent: true,  important: true  },
    { id: 'q2', label: '🔵 Schedule',  desc: 'Not urgent + Important',  cls: 'matrix-q2', urgent: false, important: true  },
    { id: 'q3', label: '🟡 Delegate',  desc: 'Urgent + Not important',  cls: 'matrix-q3', urgent: true,  important: false },

      ${QUADS.map(q => {
        const cards = active.filter(t => isUrgent(t) === q.urgent && isImportant(t) === q.important);
        return `
        <div class="matrix-quadrant ${q.cls}" data-quad="${q.id}">
          <div class="matrix-q-header">
            <div class="matrix-q-label">${q.label} <span class="matrix-q-count">${cards.length}</span></div>
            <div class="matrix-q-desc">${q.desc}</div>
          </div>

              <div class="kanban-card-meta">
                <span class="status-pill ${t.status}" style="font-size:10px;padding:1px 5px">${statusLabel(t.status)}</span>
                🍅 ${t.completedPomodoros ?? 0}
                ${t.dueDate ? `<span>📅 ${t.dueDate}</span>` : ''}
              </div>
            </div>`).join('')}
        </div>`;
